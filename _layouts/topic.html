---
layout: base
---
{%- assign topic = site.data.topics | where: "key", page.topic | first %}
        <section id="{{ page.topic }}-notes">
          <p class="notes-back"><a href="{{ '/notes.html' | relative_url }}">&larr; All notes</a></p>
          <h2>{{ topic.title }}</h2>
          {%- if topic.note %}
          <p class="section-note">{{ topic.note }}</p>
          {%- endif %}
{% assign topic_posts = site.categories[page.topic] %}{% include post-list.html posts=topic_posts %}
        </section>
